name: KakaoBanner
options:
  deploymentTarget:
    macOS: "27.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  KakaoBanner:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koreaaitel.kakaobannerstudio
        MARKETING_VERSION: "0.0.3"
        PRODUCT_NAME: "카카오톡 배너 스튜디오"
        EXECUTABLE_NAME: KakaoBanner
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "카카오톡 배너 스튜디오"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: BannerProxy
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
  BannerProxy:
    type: system-extension
    platform: macOS
    sources: [Proxy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koreaaitel.kakaobannerstudio.proxy
        PRODUCT_NAME: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Proxy/Info.plist
        CODE_SIGN_ENTITLEMENTS: Proxy/Proxy.entitlements
